# Netlify config for the place-based-memory narrative site.
# Publish dir is this folder; index.html is the Why deck.
[build]
  publish = "narrative"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/why"
  to = "/index.html"
  status = 200
