# Netlify config for the place-based-memory narrative site.
# Publish dir is this folder; index.html is the Why deck.
[build]
  publish = "narrative"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/why"
  to = "/index.html"
  status = 200

# raw transcripts and banks should render in-browser, not download
[[headers]]
  for = "/evidence/*.md"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/evidence/*/*.md"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/evidence/*/runs/*/*.md"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
